name: UI CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: ui-ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build UI library
        run: npm run build:ui

  publish-npm:
    name: Publish UI + GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read package metadata
        id: pkg
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./projects/ui/package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./projects/ui/package.json').version")"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=ui-v$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version already exists on npm
        id: npm-check
        shell: bash
        run: |
          set +e
          npm view "${{ steps.pkg.outputs.package_name }}@${{ steps.pkg.outputs.package_version }}" version >/dev/null 2>&1
          EXISTS=$?
          set -e
          if [ "$EXISTS" -eq 0 ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version already exists on npm. Skipping publish."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Version not found on npm. Publish will run."
          fi

      - name: Build UI library
        if: steps.npm-check.outputs.should_publish == 'true'
        run: npm run build:ui

      - name: Publish package
        if: steps.npm-check.outputs.should_publish == 'true'
        run: npm run publish:ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create and push release tag
        if: steps.npm-check.outputs.should_publish == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.pkg.outputs.tag_name }}"
          git push origin "${{ steps.pkg.outputs.tag_name }}"

      - name: Create GitHub Release (Latest)
        if: steps.npm-check.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag_name }}
          name: UI v${{ steps.pkg.outputs.package_version }}
          generate_release_notes: true
          make_latest: true
