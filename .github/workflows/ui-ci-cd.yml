name: UI CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build UI library
        run: npm run build:ui

  publish-npm:
    name: Publish UI to npm
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Read package metadata
        id: pkg
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./projects/ui/package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./projects/ui/package.json').version")"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version already exists on npm
        id: npm-check
        shell: bash
        run: |
          set +e
          npm view "${{ steps.pkg.outputs.package_name }}@${{ steps.pkg.outputs.package_version }}" version >/dev/null 2>&1
          EXISTS=$?
          set -e
          if [ "$EXISTS" -eq 0 ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version already exists on npm. Skipping publish."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Version not found on npm. Publish will run."
          fi

      - name: Build UI library
        if: steps.npm-check.outputs.should_publish == 'true'
        run: npm run build:ui

      - name: Publish package
        if: steps.npm-check.outputs.should_publish == 'true'
        run: npm publish ./dist/ui --access public --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
