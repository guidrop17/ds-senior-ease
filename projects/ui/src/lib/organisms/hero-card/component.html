<section class="ui-hero-card">
  <div class="ui-hero-card__copy">
    @if (eyebrow) {
      <ui-badge [label]="eyebrow" variant="primary"></ui-badge>
    }

    <ui-text element="h2" size="xl" weight="semibold">{{ title }}</ui-text>

    @if (description) {
      <ui-text element="p" tone="muted">{{ description }}</ui-text>
    }

    <div class="ui-hero-card__actions">
      @if (primaryActionLabel) {
        <ui-button [label]="primaryActionLabel"></ui-button>
      }

      @if (secondaryActionLabel) {
        <ui-button [label]="secondaryActionLabel" variant="ghost"></ui-button>
      }
    </div>
  </div>

  <div class="ui-hero-card__highlight">
    <ui-text element="span" size="sm" tone="muted">{{ highlightLabel }}</ui-text>
    <ui-text element="h3" size="xl" weight="semibold">{{ highlightValue }}</ui-text>
  </div>
</section>
