<button
  class="ui-card-button"
  [type]="type"
  [disabled]="disabled"
  [attr.aria-label]="ariaLabel || null"
  (click)="emitClick($event)"
  [class.ui-card-button--primary]="variant === 'primary'"
  [class.ui-card-button--secondary]="variant === 'secondary'"
  [class.ui-card-button--ghost]="variant === 'ghost'"
  [class.ui-card-button--ghost-secondary]="variant === 'ghost' && context === 'secondary'"
>
  <span class="ui-card-button__leading">
    @if (leading) {
      @if (useLeadingIcon && !isTemplate(leading)) {
        <span class="ui-card-button__icon-container" [ngClass]="iconContainerClass">
          <ui-icon
            [name]="resolveIconName(leading)"
            [icon]="resolveIconDefinition(leading)"
            [decorative]="true"
          ></ui-icon>
        </span>
      } @else if (!useLeadingIcon && isTemplate(leading)) {
        <ng-container [ngTemplateOutlet]="$any(leading)"></ng-container>
      }
    }

    <span class="ui-card-button__copy">
      <span class="ui-card-button__title">{{ title }}</span>
      @if (isTemplate(description)) {
        <ng-container [ngTemplateOutlet]="$any(description)"></ng-container>
      } @else if (description) {
        <span class="ui-card-button__description">{{ description }}</span>
      }
    </span>
  </span>

  @if (trailing) {
    @if (useTrailingIcon && !isTemplate(trailing)) {
      <span class="ui-card-button__trailing">
        <ui-icon
          [name]="resolveIconName(trailing)"
          [icon]="resolveIconDefinition(trailing)"
          [decorative]="true"
        ></ui-icon>
      </span>
    } @else if (!useTrailingIcon && isTemplate(trailing)) {
      <span class="ui-card-button__trailing">
        <ng-container [ngTemplateOutlet]="$any(trailing)"></ng-container>
      </span>
    }
  }
</button>
